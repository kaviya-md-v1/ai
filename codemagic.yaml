workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Android
        script: |
          yes | flutter create --platforms=android .
      - name: Restore our files
        script: git checkout -- lib/ pubspec.yaml
      - name: Dependencies
        script: flutter pub get
      - name: Build
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
