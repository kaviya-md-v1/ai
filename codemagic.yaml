workflows:
  android-release:
    name: Android Release
    environment:
      flutter: stable
    scripts:
      - name: Step 1 - Create android folder FIRST
        script: flutter create . --platforms android
      - name: Step 2 - Get dependencies AFTER
        script: flutter pub get
      - name: Step 3 - Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
